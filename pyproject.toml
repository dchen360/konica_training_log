[project]
name = "konica-training-log"
version = "0.1.0"
description = "Interrater reliability analysis for Konica Minolta measurements."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "seaborn>=0.13",
  "statsmodels>=0.14",
  "streamlit>=1.39",
  "plotly>=5.24",
]

[dependency-groups]
dev = [
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
